<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> BÀI 7</title>
</head>
<body>
    <form>
    <main>
        <section>
            <table style="color: blue;">
                <tr>
                    <td><label for="name">Họ và Tên:</label></td>
                    <td><input type="text" id="name" placeholder="Nguyen Van A"></td>
                </tr>

                <tr>
                    <td style="text-align: right;"><label for="email">Email:</label></td>
                    <td><input type="email" id="email" placeholder="@ABCD.com"></td>
                </tr>

                <tr>
                    <td style="text-align: right; vertical-align: top;">Sở thích:</td>

                    <!-- Cột 1 -->
                    <td>
                        <input type="checkbox" id="sport">
                        <label for="sport">Thể thao</label><br>

                        <input type="checkbox" id="web">
                        <label for="web">Lướt web</label><br>

                        <input type="checkbox" id="travel">
                        <label for="travel">Du lịch</label>
                    </td>

                    <!-- Cột 2 -->
                    <td>
                        <input type="checkbox" id="music">
                        <label for="music">Âm nhạc</label><br>

                        <input type="checkbox" id="game">
                        <label for="game">Chơi Game</label><br>
                    </td>

                    
                    <td>
                        <input type="checkbox" id="book">
                        <label for="book">Đọc sách</label><br>

                        <input type="checkbox" id="movie">
                        <label for="movie">Điện ảnh</label><br>
                    </td>
                </tr>

                
                <footer>
                    <tr>
                        <td colspan="4" style="text-align: center; padding-top: 10px;">
                        <button type="submit">Gửi thông tin</button>
                        <button type="reset" style="margin-left: 10px;">Nhập lại</button>
                        </td>
                    </tr>
                </footer>

            </table>
        </section>
    </main>
</form>
</body>
</html>
