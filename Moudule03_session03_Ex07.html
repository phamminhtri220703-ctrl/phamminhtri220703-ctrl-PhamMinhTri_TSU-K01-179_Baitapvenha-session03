<body>

    <main>

                    </td>
                    <td>

                    </td>
                    <td>
                        <input type="checkbox" name="" id="book">
                        <label for="book">Đọc sách</label><br>
                
                        <input type="checkbox" name="" id="movie">
                        <label for="movie">Điện ảnh</label><br>
                    </td>
                </tr>

            </table>
        </section>
    </main>
    <footer>
        <tr>
    <td></td>
    <td style="text-align: center;">
        <input type="submit" value="Gửi thông tin"
               style="background-color: orange; color: white; padding: 5px 10px; border: none;">

        <input type="reset" value="Nhập lại"
               style="background-color: gray; color: white; padding: 5px 10px; border: none; margin-left: 10px;">
    </td>
        </tr>
    </footer>
